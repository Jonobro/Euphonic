<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Spotify Authentication</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'spotify_auth/css/error.css' %}">
</head>
<body>
    <div class="container">
        <h1>Authentication Error</h1>
        
        <p>There was a problem connecting to Spotify. Please return to the login screen and try again.</p>

        <!-- NOTE! Remove this more specific error information in production once you have everything working -->
        {% if error %}
            <p><strong>Details:</strong> {{ error }}</p>
        {% endif %}
        <!-- NOTE! Remove this more specific error information in production once you have everything working -->
        
        <a href="{% url 'index' %}" class="button">Back to Login</a>
    </div>
</body>
</html>
