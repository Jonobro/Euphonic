<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Euphonic Intelligence</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'spotify_auth/css/chat.css' %}">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h1>Euphonic Intelligence</h1>
            <div class="tooltip-container">
                <a href="{% url 'logout' %}" class="button">Disconnect</a>
                <span class="custom-tooltip">Purges your data with Euphonic Intelligence and revokes your OAuth authorization with Spotify</span>
            </div>
        </div>
        <div id="chat-container">
            <div id="message-list" 
                 {% if is_loading_initial_data %}data-is-loading-initial="true"{% endif %}
                 {% if analysis_result and not is_loading_initial_data %}data-initial-message="{{ analysis_result|escapejs }}"{% endif %}>
            </div>
            <div id="chat-input-area">
                <textarea id="user-input" placeholder="Ask follow-up questions or request playlists..."></textarea>
                <button id="send-button" class="button">Send</button>
            </div>
        </div>
    </div>
    <div class="spotify-footer">
        <p>Powered by <a href="https://www.spotify.com" target="_blank" rel="noopener">Spotify</a></p>
        <img src="{% static 'spotify_auth/images/Full_Logo_Green_RGB.svg' %}" alt="Spotify Logo" class="spotify-logo">
    </div>
    
    <script src="{% static 'spotify_auth/js/chat.js' %}"></script>
</body>
</html>
