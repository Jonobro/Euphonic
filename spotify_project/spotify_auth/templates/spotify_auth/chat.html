<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Euphonic Intelligence</title>
    {% load static %}
    <link rel="preload" href="{% static 'spotify_auth/fonts/Poppins-Regular-subset.ttf' %}" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="{% static 'spotify_auth/fonts/Poppins-Medium-subset.ttf' %}" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="{% static 'spotify_auth/fonts/Poppins-SemiBold-subset.ttf' %}" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="{% static 'spotify_auth/css/chat.css' %}">
    <link rel="stylesheet" href="{% static 'spotify_auth/css/fonts.css' %}">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
</head>
<body data-chat-mode="{{ chat_mode|escapejs }}">
    <div class="container">
        <div class="header-row">
            <img src="{% static 'spotify_auth/images/EuphonicIntelligenceLogo.svg' %}" alt="Euphonic Intelligence Logo" class="header-logo">
            <div class="header-buttons">
                <a href="{% url 'pre_chat' %}" class="button">Back</a>
                <div class="tooltip-container">
                    <a href="{% url 'logout' %}" class="button">Disconnect</a>
                    <span class="custom-tooltip">Purges your data with Euphonic Intelligence</span>
                </div>
            </div>
        </div>
        <div id="chat-container">
            <div id="message-list" 
                {% if is_loading_initial_data %}data-is-loading-initial="true"{% endif %}
                {% if initial_analysis_task_id %}data-initial-analysis-task-id="{{ initial_analysis_task_id }}"{% endif %}>
            </div>
            <div id="chat-input-area">
                <textarea id="user-input" placeholder="Reply to Aria..."></textarea>
                <button id="send-button" class="button">Send</button>
            </div>
        </div>
    </div>
    
    <div class="spotify-footer">
        <div class="legal-links">
            <a href="#" onclick="openModal('privacy')">Privacy Policy</a>
            <span>|</span>
            <a href="#" onclick="openModal('eula')">EULA</a>
            <span>|</span>
            <a href="mailto:support@euphonicintelligence.com">Contact Us</a>
        </div>
        <div class="powered-by-container">
            <span>Powered by </span>
            <img src="/static/spotify_auth/images/Full_Logo_Green_RGB.svg" alt="Spotify Logo" class="spotify-logo">
        </div>
    </div>

    <!-- Legal Modal -->
    <div id="legalModal" class="legal-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Legal Document</h2>
                <span class="close-modal" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Content will be loaded here -->
            </div>
        </div>
    </div>
    
    <script id="chat-history-data" type="application/json">
        {{ chat_history_json|safe }}
    </script>
    <script src="{% static 'spotify_auth/js/chat.js' %}"></script>
    <script src="{% static 'spotify_auth/js/playlist_handler.js' %}"></script>
    <script>
        function openModal(type) {
            const modal = document.getElementById('legalModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            
            const content = {
                privacy: {
                    title: 'Privacy Policy',
                    body: `
                        <p style="font-size:inherit; margin-bottom:20px;"><strong>Last Updated:</strong> May 15, 2025</p>
                        <p>Jonathan Yoder, operating as Euphonic Intelligence ("we," "us," or "our") is committed to protecting your privacy. This Privacy Policy explains how we collect, use, disclose, share, and retain your information when you use the Euphonic Intelligence application (the "Application" or "Service").</p>

                        <p>Please read this Privacy Policy carefully. By accessing or using the Application, you agree to the collection and use of information in accordance with this policy. This Privacy Policy should be read in conjunction with our End-User License Agreement (EULA).</p>

                        <h3>1. Information We Collect and Use</h3>
                        <p>We collect the following types of information:</p>
                        <div style="padding-left:20px;">
                            <p><strong>a. Information from Spotify:</strong> When you connect your Spotify account to our Service, we request your authorization to access certain information from your Spotify account via the Spotify API. We only request the permissions (OAuth scopes) necessary to provide the features of our Service. This includes:</p>
                            <ul style="padding-left:40px;">
                                <li><strong>Spotify Authentication Tokens</strong>: Access and refresh tokens from Spotify to authenticate you and access your Spotify data on your behalf and to maintain your login session. These are stored securely in your session.</li>
                                <li><strong>Spotify Library</strong>: We use the <code>user-library-read</code> scope to access your "Liked Songs" which we then parse and send to Google's Gemini API. This allows us to understand your musical preferences and create custom playlists using your saved songs. It also allows you to have an engaging conversation with Gemini regarding your music.</li>
                                <li><strong>Spotify Playlists</strong>: We use the <code>playlist-read-private</code> and <code>playlist-read-collaborative</code> scopes to access your playlists which we then parse and send to Google's Gemini API. This allows us to understand your musical preferences and create playlists using the songs from your existing playlists.</li>
                                <li><strong>Search for an Item</strong>: We use the <code>user-read-private</code> scope to search for songs on Spotify which helps us to create playlists for our users.</li>
                                <li><strong>Playlist Creation</strong>: We use the <code>playlist-modify-private</code> and <code>playlist-modify-public</code> scopes to create new public and private playlists on your behalf (when you request and approve our doing so).</li>
                            </ul>
                            <p><strong>b. User Input Data:</strong></p>
                            <ul style="padding-left:40px;">
                                <li><strong>Chat History</strong>: The history of your conversation with the AI, including your messages and the AI's responses, will be stored in your session data for continuity during your active use.</li>
                            </ul>
                        </div>

                        <p style="font-weight:bold;">NOTE: SPOTIFY DATA, INCLUDING BUT NOT LIMITED TO YOUR "LIKED SONGS" AND SAVED PLAYLISTS, IS NEVER RETAINED BY OR INGESTED BY THE AI MODEL (GEMINI) AS PER THE TERMS OF EUPHONIC INTELLIGENCE'S PARTNERSHIP WITH GOOGLE. WHEN YOU USE THE APPLICATION, INDIVIDUAL STATELESS REQUESTS ARE MADE TO GEMINI'S API, BUT THIS DATA IS NEVER STORED ON GEMINI'S SERVERS AND IS NEVER USED FOR TRAINING PURPOSES BY GOOGLE.</p>

                        <h3>2. How We Share Your Information</h3>
                        <p>We do not sell your personal information. We share your information only in the following limited circumstances:</p>
                        <div style="padding-left:20px;">
                            <p><strong>a. With Google (Gemini API):</strong></p>
                            <ul style="padding-left:40px;">
                                <li>To provide the core AI chat and music analysis features, we send your Spotify library information (as a structured string of track names and artists) and your chat messages/prompts to Google's Gemini API for processing.</li>
                                <li>Google's use of this data is governed by Google's API Terms of Service and Privacy Policy. We send system instructions and user prompts to the Gemini model. As stated above, Google is not authorized to retain this data or use this data for training purposes.</li>
                            </ul>
                            <p><strong>b. With Spotify:</strong></p>
                            <ul style="padding-left:40px;">
                                <li>We interact with the Spotify API to authenticate you, access your authorized library data, and perform actions on your behalf (such as saving playlists). Our interactions are governed by your authorizations and Spotify's Developer Terms. We do not share your private chat messages or Gemini responses directly back to Spotify unless it's an explicit action you take (e.g., creating a new playlist based on a chat message from Gemini).</li>
                            </ul>
                            <p><strong>c. Legal Requirements:</strong></p>
                            <ul style="padding-left:40px;">
                                <li>We may disclose your information if required to do so by law or in the good faith belief that such action is necessary to comply with a legal obligation, protect and defend our rights or property, prevent or investigate possible wrongdoing in connection with the Service, protect the personal safety of users of the Service or the public, or protect against legal liability.</li>
                            </ul>
                        </div>

                        <h3>3. Contact Us</h3>
                        <p>If you have any questions, concerns, or requests regarding this Privacy Policy or your personal information, please contact us at: <a href="mailto:jyoder433@gmail.com">jyoder433@gmail.com</a></p>

                        <p>By using Euphonic Intelligence, you signify your acceptance of this Privacy Policy. If you do not agree to these terms, please do not use our Service.</p>
                    `
                },
                eula: {
                    title: 'End-User License Agreement',
                    body: `
                        <p style="font-size:inherit; margin-bottom:20px;"><strong>Last Updated:</strong> May 15, 2025</p>
                        
                        <h3>1. INTRODUCTION AND ACCEPTANCE OF TERMS</h3>
                        <p>This End-User License Agreement ("Agreement" or "EULA") is a legal contract between you ("User") and the Application developer ("we", "us", or "our"). By installing, accessing, or using the Application, you agree to be bound by these terms. If you do not agree to these terms, do not use the Application.</p>

                        <h3>2. DESCRIPTION OF SERVICE</h3>
                        <p>The Application connects to your Spotify AB ("Spotify") account to analyze your music library and, with your input via chat, generates custom playlist recommendations using AI technology. The Application is designed solely for your personal, non-commercial enjoyment of playlist recommendations.</p>

                        <h3>3. LICENSE GRANT AND RESTRICTIONS</h3>
                        <p><strong>3.1 License Grant</strong><br>
                        We grant you a limited, non-exclusive, non-transferable, revocable license to use the Application solely for your personal, non-commercial purposes.</p>

                        <p><strong>3.2 Restrictions</strong><br>
                        You agree NOT to:</p>
                        <ul>
                            <li>Reverse-engineer, decompile, disassemble, modify, create derivative works, or otherwise attempt to derive source code from any Spotify SDKs, Platform, Service, or Content used by the Application.</li>
                            <li>Bypass security mechanisms or interfere with the proper functioning of the Spotify Platform.</li>
                            <li>Use the Application to train your own AI/ML models on Spotify Content.</li>
                            <li>Copy, distribute, or make the Application or Spotify Elements available to any person, except as expressly provided in this EULA.</li>
                            <li>Use the Application or Spotify Elements for any illegal or unauthorized purpose.</li>
                            <li>Attempt to circumvent or render ineffective any geographical restrictions or other technical protection measures.</li>
                        </ul>

                        <h3>4. SPOTIFY INTEGRATION AND THIRD-PARTY BENEFICIARY</h3>
                        <p><strong>4.1 Non-Affiliation</strong><br>
                        This Application is not affiliated with, endorsed, or sponsored by Spotify.</p>

                        <p><strong>4.2 Third-Party Services</strong><br>
                        You acknowledge that the Application integrates with Spotify services operated by Spotify. Your use of Spotify's services is subject to Spotify's Terms and Conditions of Use, which are separate from this Agreement.</p>

                        <p><strong>4.3 Third-Party Beneficiary</strong><br>
                        Spotify is an express third-party beneficiary of this EULA and the Privacy Policy, and is entitled to directly enforce its terms against you. Spotify may enforce any failure by you to comply with the terms of this Agreement, including without limitation the prohibition against reverse-engineering and unauthorized use of Spotify Content.</p>

                        <h3>5. YOUR RESPONSIBILITIES</h3>
                        <ul>
                            <li>You agree not to use this Application for any unlawful, offensive, or prohibited purpose.</li>
                            <li>You agree to comply with all applicable laws and Spotify's policies when using this Application.</li>
                        </ul>

                        <h3>6. CONTACT</h3>
                        <p>If you have questions about this Agreement, please contact us at: <a href="mailto:jyoder433@gmail.com">jyoder433@gmail.com</a></p>

                        <p>By using the Application, you acknowledge that you have read this Agreement, understand it, and agree to be bound by its terms and conditions.</p>
                    `
                }
            };
            
            title.textContent = content[type].title;
            body.innerHTML = content[type].body;
            modal.style.display = 'block';
        }
        
        function closeModal() {
            document.getElementById('legalModal').style.display = 'none';
        }
        
        window.onclick = function(event) {
            const modal = document.getElementById('legalModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
