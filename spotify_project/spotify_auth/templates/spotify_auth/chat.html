<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Your Music Taste Analysis</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'spotify_auth/css/chat.css' %}">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="navigation" style="text-align:right;">
            <a href="{% url 'analytics' %}" class="button" style="margin-right: 10px;">View Analytics</a>
            <a href="{% url 'logout' %}" class="button">Logout</a>
        </div>
        <h1>Your Music Taste Analysis & Chat</h1>
        <div id="chat-container">
            <div id="message-list" data-initial-message="{{ analysis_result|escapejs }}"></div>
            <div id="chat-input-area">
                <textarea id="user-input" placeholder="Ask follow-up questions or request playlists..."></textarea>
                <button id="send-button" class="button">Send</button>
            </div>
        </div>
    </div>
    <script src="{% static 'spotify_auth/js/chat.js' %}"></script>
</body>
</html>
