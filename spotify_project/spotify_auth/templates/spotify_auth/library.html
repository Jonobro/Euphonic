<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Spotify Library</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'spotify_auth/css/library.css' %}">
</head>
<body>
    <div class="container">
        <div class="navigation">
            <a href="{% url 'spotify_profile' %}" class="button">Back to Profile</a>
        </div>

        <h1>Your Saved Tracks</h1>

        <p>Total Tracks: {{ total }}</p>

        <div class="library-string-container">
            <pre>{{ library_string }}</pre>
        </div>
    </div>
</body>
</html>
