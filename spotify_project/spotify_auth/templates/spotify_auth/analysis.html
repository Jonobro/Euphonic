{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Analysis</title>
</head>
<body>
    <h1>Your Spotify Data Analysis</h1>
    <div id="analysis-container">
        <p>Your analysis results will be displayed here.</p>
    </div>

    {% if user_library %}
    <h2>Your Spotify Library</h2>
    <div class="library-string-container">
        <pre>
        {% for track in user_library %}
{{ track.name }} by {{ track.artists }}
        {% endfor %}
        </pre>
    </div>
    {% endif %}

    <script id="analysis-script-data"
        data-is-loading-initial="{{ is_loading_initial_data|yesno:"true,false" }}"
        data-chat-history-json="{{ chat_history_json|escapejs }}"
        data-initialize-chat-data-url="{% url 'initialize_chat_data' %}">
    </script>
    <script src="{% static 'js/analysis.js' %}" defer></script>
</body>
</html>
