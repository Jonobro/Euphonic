  <defs>
    <style type="text/css">
        /* Define the clockwise rotation animation */
        @keyframes rotate-clockwise {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Define the counter-clockwise rotation animation */
        @keyframes rotate-counter-clockwise {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(-360deg);
            }
        }

        /* Apply clockwise animation to the first and third groups.
           The transform-origin is the center of the SVG's viewBox (11.90625px 11.90625px).
           Animation duration is 1s. */
        #g1, #g3 {
            animation: rotate-clockwise 1s linear infinite;
            transform-origin: 11.90625px 11.90625px;
        }

        /* Apply counter-clockwise animation to the second group.
           Animation duration is now 1s. */
        #g2 {
            animation: rotate-counter-clockwise 1s linear infinite;
            transform-origin: 11.90625px 11.90625px;
            animation-delay: -0.33s; /* Adjusted delay for the new speed */
        }

        /* Stagger the animation for the third element */
        #g3 {
            animation-delay: -0.67s; /* Adjusted delay for the new speed */
        }
    </style>
  </defs>
