worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    access_log /var/log/nginx/access.log;
    
    sendfile on;
    keepalive_timeout 300s;
    limit_conn_status 429;

    limit_req_zone $binary_remote_addr zone=zone_general:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=zone_api:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    map $limit_req_status $rl_json {
        default        '';
        REJECTED       '{"error":"Rate limit exceeded. Please slow down."}';
        DELAYED        '';
        PASSED         '';
    }

    server {
        listen 80;
        server_name euphonicintelligence.com www.euphonicintelligence.com;

        add_header X-Content-Type-Options "nosniff" always;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://euphonicintelligence.com$request_uri;
        }
    }
    
    server {
        listen 443 ssl;
        server_name www.euphonicintelligence.com;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        ssl_certificate /etc/letsencrypt/live/euphonicintelligence.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/euphonicintelligence.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://euphonicintelligence.com$request_uri;
    }

    server {
        listen 443 ssl;
        server_name euphonicintelligence.com;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), browsing-topics=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

        ssl_certificate /etc/letsencrypt/live/euphonicintelligence.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/euphonicintelligence.com/privkey.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

        limit_conn conn_per_ip 10;

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        location ~ ^/(chat_message_api|import_playlists|validate_playlist|initialize_chat_data)/ {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            limit_req zone=zone_api burst=10 nodelay;
            add_header X-RateLimit-Zone api always;
            add_header X-RateLimit-State $limit_req_status always;
            if ($limit_req_status = REJECTED) {
                add_header Content-Type application/json;
                return 429 $rl_json;
            }

            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /stream_chat_response/ {
            limit_conn conn_per_ip 5;
            add_header Cache-Control "no-store" always;
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_buffering off;
            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /stream_initial_analysis/ {
            limit_conn conn_per_ip 5;
            add_header Cache-Control "no-store" always;
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_buffering off;
            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
        }

        location / {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            limit_req zone=zone_general burst=25 nodelay;
            add_header X-RateLimit-Zone general always;
            add_header X-RateLimit-State $limit_req_status always;
            if ($limit_req_status = REJECTED) {
                add_header Content-Type application/json;
                return 429 $rl_json;
            }

            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}