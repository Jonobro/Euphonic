worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    access_log /var/log/nginx/access.log;
    
    sendfile on;
    keepalive_timeout 300s;
    
    server {
        listen 80;
        server_name euphonicintelligence.com www.euphonicintelligence.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://euphonicintelligence.com$request_uri;
        }
    }
    
    server {
        listen 443 ssl;
        server_name www.euphonicintelligence.com;

        ssl_certificate /etc/letsencrypt/live/euphonicintelligence.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/euphonicintelligence.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://euphonicintelligence.com$request_uri;
    }

    server {
        listen 443 ssl;
        server_name euphonicintelligence.com;
        
        ssl_certificate /etc/letsencrypt/live/euphonicintelligence.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/euphonicintelligence.com/privkey.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }
        
        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /stream_chat_response/ {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Disable buffering for SSE
            proxy_buffering off;

            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /stream_initial_analysis/ {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Disable buffering for SSE
            proxy_buffering off;

            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}