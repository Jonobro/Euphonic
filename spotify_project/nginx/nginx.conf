# Global settings
worker_processes auto;

# Log and process settings
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Connection processing
events {
    worker_connections 1024;
}

# HTTP server configuration
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging
    access_log /var/log/nginx/access.log;
    
    # Performance settings
    sendfile on;
    keepalive_timeout 300s;
    
    # HTTP server - for ACME challenges and redirection
    server {
        listen 80;
        server_name euphonicintelligence.com www.euphonicintelligence.com;

        # Serve ACME challenge files for Certbot for both domains
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to the canonical HTTPS domain
        location / {
            return 301 https://euphonicintelligence.com$request_uri;
        }
    }
    
    # HTTPS server - redirect www to non-www
    server {
        listen 443 ssl;
        server_name www.euphonicintelligence.com;

        ssl_certificate /etc/letsencrypt/live/euphonicintelligence.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/euphonicintelligence.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://euphonicintelligence.com$request_uri;
    }

    # HTTPS server - main configuration
    server {
        listen 443 ssl;
        server_name euphonicintelligence.com;
        
        ssl_certificate /etc/letsencrypt/live/euphonicintelligence.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/euphonicintelligence.com/privkey.pem;
        
        # SSL configurations
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        
        # Static file handling
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }
        
        # Proxy requests to Gunicorn
        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Proxy connection settings for standard requests
            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Specific location for chat response Server-Sent Events to disable buffering
        location /stream_chat_response/ {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Disable buffering for SSE
            proxy_buffering off;

            # Proxy connection settings for streaming
            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Specific location for analysis Server-Sent Events to disable buffering
        location /stream_initial_analysis/ {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Disable buffering for SSE
            proxy_buffering off;

            # Proxy connection settings for streaming
            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}