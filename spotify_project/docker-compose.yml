services:
  web:
    build: .
    volumes:
      - static_volume:/app/staticfiles
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DJANGO_DEBUG=False
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - static_volume:/app/staticfiles
    restart: always
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c '
        trap exit TERM;
        while :; do
          certbot renew --deploy-hook \
            "docker kill -s HUP $$(docker ps -q --filter label=com.docker.compose.service=nginx --filter label=com.docker.compose.project=spotify_project)";
          sleep 12h & wait $${!};
        done;
      '

volumes:
  static_volume:
  certbot_certs:
  certbot_www:
