services:
  web:
    build: .
    volumes:
      - static_volume:/app/staticfiles
    env_file:
      - .env
    environment:
      - DJANGO_DEBUG=False

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - static_volume:/app/staticfiles
    restart: always
    depends_on:
      - web

volumes:
  static_volume:
