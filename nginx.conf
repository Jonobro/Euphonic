# Global settings
worker_processes auto;

# Log and process settings
error_log C:/nginx-1.27.4/logs/error.log warn;
pid C:/nginx-1.27.4/logs/nginx.pid;

# Connection processing
events {
    worker_connections 1024;
}

# HTTP server configuration
http {
    include C:/nginx-1.27.4/conf/mime.types;
    default_type application/octet-stream;
    
    # Logging
    access_log C:/nginx-1.27.4/logs/access.log;
    
    # Performance settings
    sendfile on;
    keepalive_timeout 65;
    
    # HTTP server - just for redirection
    server {
        listen 80;
        server_name localhost;
        
        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }
    
    # HTTPS server - with SSL and proxying
    server {
        listen 443 ssl;
        server_name localhost;
        
        ssl_certificate C:/nginx-1.27.4/ssl/nginx.crt;
        ssl_certificate_key C:/nginx-1.27.4/ssl/nginx.key;
        
        # SSL configurations
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }
    }
}