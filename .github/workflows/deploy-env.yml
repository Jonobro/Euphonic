name: Deploy application to DigitalOcean

on:
  push:
    branches:
      - EuphonicIntelligence
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'SHA of the commit to deploy'
        required: false

jobs:
  deploy_application:
    name: Deploy application to server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha }}

      - name: Deploy to server and restart application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          port: 22
          script: |
            set -e
            
            echo "==> Navigating to project directory..."
            cd /opt/euphonic-intelligence/Euphonic-Intelligence/spotify_project/
            
            echo "==> Configuring git remote with PAT..."
            git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git
            
            # Use the specific commit SHA for push events, or the user input/branch for dispatch events.
            COMMIT_TO_DEPLOY="${{ github.event.inputs.commit_sha || github.sha }}"
            echo "==> Fetching latest code and checking out commit: $COMMIT_TO_DEPLOY"
            git fetch origin
            git reset --hard "$COMMIT_TO_DEPLOY"
            
            echo "==> Creating/updating .env file..."
            cat <<EOF > .env
            ${{ secrets.ENV_FILE_CONTENT }}
            EOF
            
            echo "==> Setting .env file ownership and permissions..."
            chown appuser:appuser .env
            chmod 600 .env
            
            echo "==> Docker compose down..."
            docker compose -f docker-compose.yml down

            echo "==> Docker compose up..."
            docker compose -f docker-compose.yml up --build -d
            
            echo "==> Pruning unused Docker images..."
            docker image prune -af
            
            echo "==> Deployment successful"